# BK7252 (BK7221U): memory map and the devices needed to boot a firmware
# image. What the family shares is in BK72XX; modules that take interrupt lines
# or signals from another module are listed after it.

extends = "BK72XX"
name = "BK7252"

[[memory]]
name = "TCM"
base = 0x003F8000
size = 0x8000
reset_fill = 0xAA

[[memory]]
name = "RAM2"
base = 0x00900000
size = 0x40000
reset_fill = 0xAA

[alias]
IRAM = 0x00900000

[[module]]
name = "SCTRL"
[module.params]
chip_id = 0x0007221a
device_id = 0x18221020

# The BK7221U PWM (vendor SDK pwm.h: PWM_NEW_BASE + 0x80, after the timers).
# The vendor bootloader times its UART download wait with PWM0, the vendor
# SDK's RTOS tick is PWM0 too. The interrupt is ICU source 9. hz: the 26 MHz
# clock the vendor SDK picks.
[[module]]
type = "pwm"
name = "PWM"
[module.bases]
regs = 0x00802A80
[module.params]
intc = "ICU"
irq = 9
hz = 26000000

[[module]]
type = "unknown"
name = "AUDIO"
[module.bases]
regs = 0x00802B00
[module.params]
size = 192
log_level = "debug"
[module.params.reset_words]
"0x38" = 0x0000f000
"0x3C" = 0x00001836

# The SD host with no card: a command times out.
[[module]]
type = "sdhost"
name = "SDCARD"
[module.bases]
regs = 0x00802D00
[module.params]
size = 0x100
[module.params.reset_words]
"0x08" = 0xffffffff
"0x10" = 0xffffffff
"0x30" = 0xf79ffeff
"0x34" = 0x00fb0000

[[module]]
type = "unknown"
name = "LA"
[module.bases]
regs = 0x10E00000
[module.params]
size = 64
log_level = "debug"

# No sensor: a built-in picture is "captured" every frame_interval_ms and its
# frame ends encode_ms later; its words reach the FIFO burst_words at a time,
# evenly over that time, as a sensor would deliver them. The interrupt is FIQ source 29; dma_request 8 is
# the GDMA's JPEG line.
[[module]]
type = "jpeg"
name = "JPEG"
[module.bases]
regs = 0x0080A000
[module.params]
intc = "ICU"
irq = 29
dma = "GDMA"
dma_request = 8
frame_interval_ms = 62
encode_ms = 50
burst_words = 64
