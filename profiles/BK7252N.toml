# BK7252N
#
# A different chip from the BK7252 (BK7221U), despite the name: the vendor SDK
# builds it as SOC_BK7252N. The memory map, interrupt sources and peripheral
# bases below follow the vendor SDK; what the family shares is in BK72XX.
# Blocks whose register layout differs from the BK7221U one that the emulator
# models are stand-ins for now.

extends = "BK72XX"
name = "BK7252N"

# ITCM: 32 KiB at 0x003F0000 (vendor SDK linker script).
[[memory]]
name = "TCM"
base = 0x003F0000
size = 0x8000
reset_fill = 0xAA

# RAM1: 256 KiB, the only RAM in the vendor SDK linker script.

# Not in the vendor SDK linker script, but the vendor camera firmware uses it
# right after the bootloader. The size is that of the BK7221U.
[[memory]]
name = "RAM2"
base = 0x02000000
size = 0x40000
reset_fill = 0xAA

[alias]
IRAM = 0x02000000

# 2 MiB (vendor SDK linker script). jedec_id: the XTX XT25F16B of the vendor
# SDK flash table.
[[module]]
name = "FLASH"
[module.params]
jedec_id = 0x000b4015

# SCTRL reset words: those of the BK7221U; the BK7252N values are not known
# yet. 0x084 is analog_state on the BK7252N.
[[module]]
name = "SCTRL"
[module.params]
chip_id = 0x0007252a
device_id = 0x24318000  # BK7252N MP

# On the BK7252N RF control is inside the peripheral window.
[[module]]
name = "RC"
[module.bases]
regs = 0x0080D000
[module.params]
# rx_avg_calc: the RX DC measurement (rx_dc_cal_en) completes at once and
# reads no offset (rx_avg_i_rd and rx_avg_q_rd 0), so the calibration, which
# repeats until both are within 30, ends.
self_clear = { "0xF0" = 0x80FFFFFF }

# Eight channels with the per-channel registers from 0x40. The interrupt is ICU
# source 15. bus_hz: the BK7221U clock the transfer times were measured at.
[[module]]
type = "gdma_bk7252n"
name = "GDMA"

# The BK7238 SAR ADC with no analog input: every sample reads `sample`. The
# interrupt is ICU source 11.
[[module]]
type = "saradc_bk7238"
name = "SAR_ADC"

# I2C1 on GPIO20/21. On the BK7252N it is the I2C2 controller design (enable
# in config bit 31, status at 0x04, data at 0x08).
[[module]]
type = "i2c2"
name = "I2C1"

# The BLE 5.2 core (IP core and BLE core registers share the base); its
# exchange memory is in RAM.
[[module]]
type = "dummy"
name = "BLE"
[module.bases]
regs = 0x00900000
[module.params]
size = 0x214
log_level = "debug"
# Command bits the firmware sets and waits on: 0x000 bit 31, the soft reset
# (as in the RW IP control register), and 0x100 bit 31 before it reads the
# clock (a sample command, as SAMP in the RW IP slot clock register).
self_clear = { "0x000" = 0x80000000, "0x100" = 0x80000000 }

# The multimedia blocks above the peripheral window. Every one has a register
# layout of its own on the BK7252N; but for JPEG they are stand-ins. ICU
# sources: SPI_DMA 27, QSPI 25, YUV_BUF 24, AUDIO 10, I2S 4, IPCHKSUM 14.
[[module]]
type = "dummy"
name = "SPI_DMA"
[module.bases]
regs = 0x00A01000
[module.params]
size = 0x100
log_level = "debug"

[[module]]
type = "dummy"
name = "QSPI"
[module.bases]
regs = 0x00A02000
[module.params]
size = 0x100
log_level = "debug"

[[module]]
type = "dummy"
name = "YUV_BUF"
[module.bases]
regs = 0x00A04000
[module.params]
size = 0x100
log_level = "debug"

[[module]]
type = "dummy"
name = "LA"
[module.bases]
regs = 0x00A05000
[module.params]
size = 64
log_level = "debug"

# The registers are those of the BK7221U audio block.
[[module]]
type = "dummy"
name = "AUDIO"
[module.bases]
regs = 0x00A06000
[module.params]
size = 0x100
log_level = "debug"
[module.params.reset_words]
"0x38" = 0x0000f000   # ad_fifo_status: every FIFO empty
"0x3C" = 0x00001836

[[module]]
type = "dummy"
name = "I2S"
[module.bases]
regs = 0x00A06100
[module.params]
size = 0x100
log_level = "debug"

# The hardware IP checksum engine.
[[module]]
type = "dummy"
name = "IPCHKSUM"
[module.bases]
regs = 0x00A06200
[module.params]
size = 0x18
log_level = "debug"

# No sensor: a built-in picture is "captured" every frame_interval_ms and its
# frame ends encode_ms later; its words reach the FIFO burst_words at a time,
# evenly over that time, as a sensor would deliver them. The interrupt is FIQ
# source 23; dma_request 7 is the GDMA's JPEG line (GDMA_X_SRC_JPEG_TX_REQ).
[[module]]
type = "jpeg_bk7252n"
name = "JPEG"
[module.bases]
regs = 0x00A03000
[module.params]
intc = "ICU"
irq = 23
dma = "GDMA"
dma_request = 7
frame_interval_ms = 62
encode_ms = 50
burst_words = 64

# The registers start with dev_id, ver_id and clk_rst, then those of the
# BK7221U SD host. The interrupt is ICU source 12.
[[module]]
type = "dummy"
name = "SDCARD"
[module.bases]
regs = 0x00802D00
[module.params]
size = 0x100
log_level = "debug"

# Six channels, two per group of 0x40 bytes (the BK7231N PWM). PWM0 is the RTOS
# tick of the vendor SDK. The interrupt is ICU source 9.
[[module]]
type = "dummy"
name = "PWM"
[module.bases]
regs = 0x00802B00
[module.params]
size = 0xC0
log_level = "debug"

[[module]]
type = "uart"
name = "UART3"
[module.bases]
regs = 0x00802500
[module.params]
intc = "ICU"
irq = 13
