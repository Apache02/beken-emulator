# BK7252 with a 4 MiB flash instead of the 2 MiB one: everything else is the
# BK7252 profile. The XIP window stays at 2 MiB, firmware does not read the
# flash through it beyond that; the rest is read through the flash registers.
extends = "BK7252"
name = "BK7252_4M"

[[module]]
name = "FLASH"
[module.params]
size = 0x400000
jedec_id = 0x000b4016
